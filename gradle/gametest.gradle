// World only: eula/server.properties/mods under build/run/gameTest are Loom's.
def deleteGameTestWorld = tasks.register("deleteGameTestWorld", Delete) {
	delete layout.buildDirectory.dir("run/gameTest/world")
}

tasks.named("runGameTest") { dependsOn deleteGameTestWorld }

// fabric.mod.json for the gametest mod is generated, so no PR edits a list to register a test.
// The committed template is src/gametest/fabric.mod.template.json; this task fills its two
// entrypoint placeholders from the classes under src/gametest/java and writes the result where
// processGametestResources picks it up. Classes are sorted by content, not by name:
//   server GameTest    a class with an @GameTest method       -> fabric-gametest
//   client GameTest    implements FabricClientGameTest        -> fabric-client-gametest
//   evidence scenario  extends EvidenceScenario               -> fabric-client-gametest
// Filter: -PclientTests=<name or glob>[,...] keeps only matching client classes, so one client test can run alone (see README).
// Order: classes are listed sorted by name. The suite must not depend on that order: -PgametestOrder=reverse
// lists them in reverse name order, to catch a test that leaks world state into a later one.
def blankLiterals = project.ext.blankLiterals
def generatedGametestResources = layout.buildDirectory.dir("generated/gametest-resources")
def generateGametestModJson = tasks.register("generateGametestModJson") {
	// -PgametestJavaRoot points the scan at another tree, so tools/tests/test_room_carver_gate.py can feed it fixtures.
	def javaRoot = file(providers.gradleProperty("gametestJavaRoot").getOrElse("src/gametest/java"))
	def template = file("src/gametest/fabric.mod.template.json")
	def order = providers.gradleProperty("gametestOrder").getOrElse("name")
	if (!(order in ["name", "reverse"])) {
		throw new GradleException("-PgametestOrder is '${order}', expected name or reverse")
	}
	inputs.property("order", order)
	// An input, so changing the filter regenerates the list.
	def clientFilter = providers.gradleProperty("clientTests").orNull
	inputs.property("clientTests", clientFilter).optional(true)
	def outputFile = generatedGametestResources.map { it.file("fabric.mod.json") }
	def sources = fileTree(javaRoot) { include "**/*.java" }
	inputs.files(sources).withPropertyName("gametestSources")
	inputs.file(template).withPropertyName("template")
	// WorldDataGuard must list every saved-data record of the mod, or it misses a swap of a new one.
	def mainSources = fileTree("src/main/java") { include "**/*.java" }
	// A direct getDataStorage().set( (or a getDataStorage() kept in a variable, so a later set is not seen) leaks a world-global record
	// if the code between it and its restore throws. Tests swap through WorldData; only WorldData and a swap marked with the comment
	// below, with a reason, which deliberately spans listener phases within one tick, call it directly. Scratch SavedDataStorage instances are fine.
	def directSwapMarker = "// world-data:"
	// A test or scenario that opens a room in layer rock with a direct air write skips the RoomSeal that keeps worldgen lava out of it
	// (PR 229 found one that flooded). In a file that touches a layer dimension, only RoomCarver.carve, which seals first, writes a
	// room's air. A setBlock, setBlockState, setBlockAndUpdate or box/fill helper call that names Blocks.AIR is flagged; a write that is not layer
	// rock (the surface, one block inside a sealed room) carries the comment below, with its reason, on its line or the one above.
	// This misses a carve whose air is not spelled Blocks.AIR, one through destroyBlock, removeBlock or a differently named helper,
	// and one in a file that reaches a layer level without LayerChain.dimension(.
	def carveMarker = "// room-carver:"
	def carveWrite = ~/\b(?:setBlock|setBlockState|setBlockAndUpdate|box|fill|fillFloor|fillRock)\s*\([^;]*\bBlocks\.(?:CAVE_)?AIR\b/
	// A client GameTest or client test support file that waits with context.waitFor(pred[, ticks]) or waitForScreen waits on a tick budget
	// (Fabric's default is 200 ticks). The client and server tick unthrottled, so the same budget is a different wall time under load,
	// and the test flakes (issues 262, 277). Wait with ClientWait.until or ClientWait.screen, which poll a wall-clock deadline and name
	// what they awaited and what they saw. A fixed span of ticks that is not a poll uses waitTicks. A waitFor that must stay carries the
	// comment below, with a reason, on its line or the one above; a bare marker, or one inside a string, does not count.
	// Evidence scenarios are not scanned.
	def tickWaitMarker = "// tick-wait:"
	// One rule for every marker in this file: `// <name>:` then a reason, on the line with literals blanked (blankLiterals), so a bare
	// marker or one inside a string, text block or char literal never counts. A gate asks hasMarker, never a plain contains.
	def hasMarker = { String rawLine, String marker ->
		(rawLine =~ "//\\s*${java.util.regex.Pattern.quote(marker.substring(2).trim())}\\s*\\S").find()
	}
	def tickWaitCall = ~/\bwaitFor(?:Screen)?\s*\(/
	def guardSource = file("src/gametest/java/io/github/pkeppeler/deepcharter/test/support/WorldDataGuard.java")
	inputs.files(mainSources).withPropertyName("mainSources")
	outputs.file(outputFile)

	doLast {
		def server = []
		def client = []
		def problems = []
		sources.files.sort().each { source ->
			def className = javaRoot.toPath().relativize(source.toPath()).toString()
				.replaceAll(/\.java$/, "").replace(File.separator, ".")
			def simpleName = className.substring(className.lastIndexOf(".") + 1)
			// Code only: comments and string literals (text blocks included) must not match.
			def text = source.text.replaceAll(/(?s)"""(?:\\.|.)*?"""|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'|\/\*.*?\*\/|\/\/[^\n]*/) { match ->
				(match.startsWith("/") ? " " : "\"\"") + match.replaceAll(/[^\n]/, "")
			}
			if (source.name != "WorldData.java") {
				def rawLines = blankLiterals(source.text).readLines()
				def direct = text =~ /getDataStorage\(\)\s*\.\s*set\s*\(|getDataStorage\(\)\s*[;,)]/
				while (direct.find()) {
					def line = text.substring(0, direct.start()).count("\n")
					def marked = [line, line - 1].any { it >= 0 && hasMarker(rawLines[it], directSwapMarker) }
					if (!marked) {
						problems << "${className}:${line + 1} swaps or keeps getDataStorage() directly; swap a world-global record with WorldData.with, WorldData.swap or WorldData.replace, which restore it in a finally, or mark a deliberate listener-phase swap with '${directSwapMarker} <reason>'"
					}
				}
			}
			if (text.contains("LayerChain.dimension(")) {
				def rawLines = blankLiterals(source.text).readLines()
				def carve = text =~ carveWrite
				while (carve.find()) {
					def line = text.substring(0, carve.start()).count("\n")
					def marked = [line, line - 1].any { it >= 0 && hasMarker(rawLines[it], carveMarker) }
					if (!marked) {
						problems << "${className}:${line + 1} writes air in a file that touches a layer dimension; carve a room with RoomCarver.carve, which seals the shell against worldgen lava first, or mark a write that is not layer rock with '${carveMarker} <reason>'"
					}
				}
			}
			if ((text =~ /\bimplements\s+[^{]*\bFabricClientGameTest\b/).find() || className.contains(".test.support.")) {
				def rawLines = blankLiterals(source.text).readLines()
				def tickWait = text =~ tickWaitCall
				while (tickWait.find()) {
					def line = text.substring(0, tickWait.start()).count("\n")
					def marked = [line, line - 1].any { it >= 0 && hasMarker(rawLines[it], tickWaitMarker) }
					if (!marked) {
						problems << "${className}:${line + 1} waits with waitFor or waitForScreen, a tick budget; poll the wall clock with ClientWait.until or ClientWait.screen, or mark a deliberate fixed-tick wait with '${tickWaitMarker} <reason>'"
					}
				}
			}
			if (text =~ /\babstract\s+class\s/) {
				return
			}
			def isServer = (text =~ /@GameTest\b/).find()
			def isClient = (text =~ /\bimplements\s+[^{]*\bFabricClientGameTest\b|\bextends\s+EvidenceScenario\b/).find()
			if (isServer && isClient) {
				problems << "${className} has both an @GameTest method and is a client GameTest; split it in two"
			} else if (isServer) {
				server << className
			} else if (isClient) {
				client << className
			} else if (simpleName.endsWith("Test") || simpleName.endsWith("Scenario")) {
				problems << "${className} is named like a test but has no @GameTest method, does not implement FabricClientGameTest and does not extend EvidenceScenario, so it would not be registered"
			}
		}
		if (server.isEmpty()) {
			problems << "no server GameTest class (a class with an @GameTest method) found under src/gametest/java"
		}
		if (client.isEmpty()) {
			problems << "no client GameTest or evidence scenario found under src/gametest/java"
		}
		def guarded = guardSource.text
		mainSources.files.sort().each { source ->
			(source.text =~ /SavedDataType<(\w+)>\s+TYPE\b/).each { match, record ->
				if (!guarded.contains("${record}.TYPE")) {
					problems << "${record} declares a SavedDataType, which ${guardSource.name} does not watch; add ${record}.TYPE to its WATCHED list"
				}
			}
		}
		if (!problems.isEmpty()) {
			throw new GradleException("gametest entrypoints:\n  " + problems.join("\n  "))
		}

		if (clientFilter != null) {
			def terms = clientFilter.split(",", -1).collect { it.trim() }
			if (terms.any { it.isEmpty() }) {
				throw new GradleException("-PclientTests is '${clientFilter}', expected comma-separated client test class names or globs")
			}
			def kept = [] as Set
			def unmatched = []
			terms.each { term ->
				def regex = java.util.regex.Pattern.compile(term.split("\\*", -1).collect { java.util.regex.Pattern.quote(it) }.join(".*"))
				def hits = client.findAll { regex.matcher(it).matches() || regex.matcher(it.substring(it.lastIndexOf(".") + 1)).matches() }
				if (hits.isEmpty()) {
					unmatched << term
				}
				kept.addAll(hits)
			}
			if (!unmatched.isEmpty()) {
				throw new GradleException("-PclientTests term(s) ${unmatched.collect { "'${it}'" }.join(", ")} match no client GameTest or evidence scenario; client classes: ${client.sort(false).collect { it.substring(it.lastIndexOf(".") + 1) }.join(", ")}")
			}
			client = client.findAll { kept.contains(it) }
		}

		def ordered = { names -> order == "reverse" ? names.sort(false).reverse() : names.sort(false) }
		def json = template.text
		["SERVER_TESTS": server, "CLIENT_TESTS": client].each { token, names ->
			def placeholder = "\"@${token}@\""
			if (!json.contains(placeholder)) {
				throw new GradleException("${template} lacks the ${placeholder} placeholder")
			}
			json = json.replace(placeholder, ordered(names).collect { "\"${it}\"" }.join(",\n\t\t\t"))
		}
		outputFile.get().asFile.text = json
	}
}

tasks.named("processGametestResources") {
	dependsOn generateGametestModJson
	from(generatedGametestResources)
}
