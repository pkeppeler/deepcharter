# Runs the client GameTests headless on a Linux runner. Shared by client-tests.yml (all
# tests) and record-evidence.yml (one evidence scenario). The caller checks out the repo
# first; this action does the rest. Composite steps take no timeout, so the caller's job
# timeout is the only one.
name: Client GameTests
description: Headless client GameTests on a Linux runner, optionally selecting one evidence scenario.

inputs:
  evidence-scenario:
    description: Evidence scenario to record (DEEPCHARTER_EVIDENCE). Empty runs the normal tests, which skip every scenario.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      with:
        cache-read-only: false
    - shell: bash
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
    # One backend, not a matrix, to save minutes. `version` is the data version that
    # stops Minecraft's datafixer from resetting the backend to its default
    # (OptionsForceDefaultGraphicsApiFix).
    - name: Choose the OpenGL backend
      shell: bash
      run: |
        mkdir -p build/run/clientGameTest
        printf 'version:4896\npreferredGraphicsBackend:"opengl"\n' > build/run/clientGameTest/options.txt
    # Minecraft logs "Failed to create backend" and then hangs, so watch the log and
    # fail at once. The final assertion catches a Minecraft bump that resets options.txt.
    # -x deleteGameTestRunDir: Loom deletes the run dir first, which would delete options.txt.
    - name: Client GameTests
      shell: bash
      env:
        # No X server: SDL3's offscreen driver gets its GL context from EGL; naming it beats a stray DISPLAY.
        SDL_VIDEO_DRIVER: offscreen
        # Mesa software rendering (llvmpipe): the runner has no GPU.
        LIBGL_ALWAYS_SOFTWARE: "1"
        # No audio device: OpenAL Soft's null backend gives the sound engine a device that plays nothing,
        # so SoundEventListeners still fire. Without it SoundEngine never loads.
        ALSOFT_DRIVERS: "null"
        # Where EvidenceScenario writes frames and screenshots (build/evidence/<scenario>/).
        DEEPCHARTER_EVIDENCE: ${{ inputs.evidence-scenario }}
        DEEPCHARTER_EVIDENCE_DIR: ${{ github.workspace }}/build/evidence
      run: |
        log="$RUNNER_TEMP/client-gametest.log"
        ./gradlew runClientGameTest -x deleteGameTestRunDir > "$log" 2>&1 &
        gradle_pid=$!
        tail -n +1 -f "$log" --pid="$gradle_pid" &
        tail_pid=$!
        # Thread dump of the client JVM (it hosts TwoPlayerServer too) when the log is silent
        # for 60 s. A dump during a long world load or a dedicated-server start is expected
        # noise, not a failure. It exits when Gradle does; the trap is the backstop on every other exit.
        tools/ci-stall-watch.sh "$log" "$gradle_pid" 60 &
        watch_pid=$!
        trap 'kill "$watch_pid" 2>/dev/null || true' EXIT
        stop_gradle() {
          echo "::error::$1"
          kill "$gradle_pid" 2>/dev/null || true
          ./gradlew --stop > /dev/null 2>&1 || true
          wait "$tail_pid" 2>/dev/null || true
          exit 1
        }
        deadline=$((SECONDS + 180))
        while kill -0 "$gradle_pid" 2>/dev/null; do
          if grep -q 'Failed to create backend' "$log"; then
            stop_gradle "Minecraft could not create a graphics backend"
          fi
          if [ "$SECONDS" -ge "$deadline" ] \
            && ! grep -q 'Created window using SDL video driver' "$log"; then
            stop_gradle "No Minecraft window after 3 minutes"
          fi
          sleep 2
        done
        status=0
        wait "$gradle_pid" || status=$?
        wait "$tail_pid" || true
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        if ! grep -q 'Using graphics backend OpenGL' "$log"; then
          echo "::error::The client did not use the OpenGL backend that options.txt asks for"
          exit 1
        fi
