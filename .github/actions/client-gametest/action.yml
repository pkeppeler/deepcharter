# Runs the client GameTests headless on a Linux runner. Shared by client-tests.yml (all
# tests) and record-evidence.yml (one evidence scenario). The caller checks out the repo
# (and, for a shard, downloads the compiled build) first; this action does the rest. Composite steps take no timeout, so the run
# step enforces its own deadline.
name: Client GameTests
description: Headless client GameTests on a Linux runner, optionally selecting one evidence scenario.

inputs:
  job-start:
    description: Epoch seconds the job began (`date +%s` in its first step). The run step's deadline counts from it, not from the step's own start, so the setup before the step cannot push the job past its limit.
    required: true
  evidence-scenario:
    description: Evidence scenario to record (DEEPCHARTER_EVIDENCE). Empty runs the normal tests, which skip every scenario.
    required: false
    default: ""
  client-tests:
    description: Client test class filter (-PclientTests). Empty runs every client test. For an evidence scenario, its class (tools/record-evidence.sh --print-class).
    required: false
    default: ""
  client-shard:
    description: Shard i/n of the client classes (-PclientShard, balanced by gradle/client-test-weights.txt), so parallel jobs split the suite. Empty runs them all.
    required: false
    default: ""
  skip-compile:
    description: Gradle arguments that skip the compile tasks when the classes were downloaded from the compile job (download-compiled's skip output); empty compiles here.
    required: false
    default: ""
  gradle-cache-read-only:
    description: "'true' to restore the Gradle cache without saving it (a shard: the compile job saves it, and a save costs seconds of the job's five minutes)."
    required: false
    default: "false"
  artifact-suffix:
    description: Appended to the screenshots artifact name, so parallel shards do not collide.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: 25
    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      with:
        cache-read-only: ${{ inputs.gradle-cache-read-only }}
    # A restored Gradle home can be broken: its module metadata points at dependency files that
    # were never restored, so verification fails and the failed run saves the broken state again
    # (#830). This resolves everything the run needs first (the compile classpaths through `classes`,
    # the run's runtime classpaths through resolveClientGameTestRuntime) and, on a dependency-verification
    # failure only, clears the module cache and retries once with --refresh-dependencies; when a
    # repository fails to answer (Maven Central's 429s, #1358), it waits and retries with backoff. It is
    # work the client run would do anyway, moved ahead of it, so a healthy run costs about nothing.
    # Never skipped: ci-gradle-resolve.sh is every job's first Gradle call and installs the Central mirror the build refuses to run
    # without (tools/tests/ci-gradle-resolve-gate.test.sh). With the compile job's classes downloaded (skip-compile) it resolves
    # only the run's runtime classpaths, with the compile tasks off.
    - name: Resolve dependencies
      shell: bash
      env:
        SKIP_COMPILE: ${{ inputs.skip-compile }}
      # SKIP_COMPILE is word-split on purpose: `-x compileJava -x ...`.
      # shellcheck disable=SC2086
      run: |
        if [ -n "$SKIP_COMPILE" ]; then
          tools/ci-gradle-resolve.sh resolveClientGameTestRuntime $SKIP_COMPILE
        else
          tools/ci-gradle-resolve.sh classes resolveClientGameTestRuntime
        fi
    # The GL libraries install in the background while Gradle resolves (the step below waits for them). `apt-get update` runs only
    # if the install fails on a stale index, which costs about 50 s a job otherwise.
    - name: Install the GL libraries (background)
      shell: bash
      run: |
        rm -f "$RUNNER_TEMP/apt.status"
        setsid nohup bash -c '
          pkgs="libegl1 libegl-mesa0 libgl1-mesa-dri"
          status=0
          sudo apt-get install -y --no-install-recommends $pkgs \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends $pkgs; } || status=$?
          echo "$status" > "$RUNNER_TEMP/apt.status"
        ' > "$RUNNER_TEMP/apt.log" 2>&1 &
    - name: Wait for the GL libraries
      shell: bash
      run: |
        for _ in $(seq 1 150); do
          [ -f "$RUNNER_TEMP/apt.status" ] && break
          sleep 2
        done
        cat "$RUNNER_TEMP/apt.log"
        if [ "$(cat "$RUNNER_TEMP/apt.status" 2>/dev/null || echo missing)" != 0 ]; then
          echo "::error::The GL libraries did not install"
          exit 1
        fi
    # One backend, not a matrix, to save minutes. `version` is the data version that
    # stops Minecraft's datafixer from resetting the backend to its default
    # (OptionsForceDefaultGraphicsApiFix).
    - name: Choose the OpenGL backend
      shell: bash
      run: |
        mkdir -p build/run/clientGameTest
        printf 'version:4896\npreferredGraphicsBackend:"opengl"\n' > build/run/clientGameTest/options.txt
    # Minecraft logs "Failed to create backend" and then hangs, so watch the log and
    # fail at once. The final assertion catches a Minecraft bump that resets options.txt.
    # -x deleteGameTestRunDir: Loom deletes the run dir first, which would delete options.txt.
    - name: Client GameTests
      shell: bash
      env:
        # No X server: SDL3's offscreen driver gets its GL context from EGL; naming it beats a stray DISPLAY.
        SDL_VIDEO_DRIVER: offscreen
        # Mesa software rendering (llvmpipe): the runner has no GPU.
        LIBGL_ALWAYS_SOFTWARE: "1"
        # No audio device: OpenAL Soft's null backend gives the sound engine a device that plays nothing,
        # so SoundEventListeners still fire. Without it SoundEngine never loads.
        ALSOFT_DRIVERS: "null"
        # Where EvidenceScenario writes frames and screenshots (build/evidence/<scenario>/).
        DEEPCHARTER_EVIDENCE: ${{ inputs.evidence-scenario }}
        DEEPCHARTER_EVIDENCE_DIR: ${{ github.workspace }}/build/evidence
        JOB_START: ${{ inputs.job-start }}
        CLIENT_TESTS: ${{ inputs.client-tests }}
        CLIENT_SHARD: ${{ inputs.client-shard }}
        SKIP_COMPILE: ${{ inputs.skip-compile }}
        # The live heap by class at the start of each test class (HeapHistogram): the leak shows as the type that grows.
        DEEPCHARTER_CLIENT_HEAP_HISTOGRAM: ${{ github.workspace }}/build/client-heap
      run: |
        log="$RUNNER_TEMP/client-gametest.log"
        filter=()
        if [ -n "$CLIENT_TESTS" ]; then
          filter=("-PclientTests=$CLIENT_TESTS")
        fi
        if [ -n "$CLIENT_SHARD" ]; then
          filter+=("-PclientShard=$CLIENT_SHARD")
        fi
        # SKIP_COMPILE is word-split on purpose: `-x compileJava -x ...`.
        # shellcheck disable=SC2086
        ./gradlew runClientGameTest -x deleteGameTestRunDir $SKIP_COMPILE "${filter[@]}" > "$log" 2>&1 &
        gradle_pid=$!
        tail -n +1 -f "$log" --pid="$gradle_pid" &
        tail_pid=$!
        # Thread dump of the client JVM (it hosts TwoPlayerServer too) when the log is silent
        # for 60 s. A dump during a long world load or a dedicated-server start is expected
        # noise, not a failure. It exits when Gradle does; the trap is the backstop on every other exit.
        tools/ci-stall-watch.sh "$log" "$gradle_pid" 60 &
        watch_pid=$!
        trap 'kill "$watch_pid" 2>/dev/null || true' EXIT
        stop_gradle() {
          echo "::error::$1"
          kill "$gradle_pid" 2>/dev/null || true
          ./gradlew --stop > /dev/null 2>&1 || true
          wait "$tail_pid" 2>/dev/null || true
          exit 1
        }
        deadline=$((SECONDS + 120))
        # The job stops at 5 minutes with no message, so the run ends first, with one. Its deadline counts from the job's start
        # (JOB_START, the first step's `date +%s`), not from this step's: the setup before the step (checkout, download, Gradle
        # cache, apt) takes 60 to 150 s and is not ours to bound. job_deadline leaves 30 s of the 300 for the post steps and the
        # runner's own teardown (tools/tests/test_ci_budget.py ties it to gradle/ci-budget.txt). Within it the step runs Gradle
        # (about 17 s), Minecraft (about 25 s) and the shard's tests, at most the budget's seconds by weight.
        # The whole-suite branch (no client-shard) is record-evidence.yml's one scenario: the same limit.
        job_deadline=270
        setup_seconds=$(( $(date +%s) - JOB_START ))
        max_seconds=$((job_deadline - setup_seconds))
        echo "Setup before this step took ${setup_seconds} s; the run has ${max_seconds} s of its ${job_deadline}-second job deadline left."
        warn_seconds=$((max_seconds * 8 / 10))
        warned=
        while kill -0 "$gradle_pid" 2>/dev/null; do
          if grep -q 'Failed to create backend' "$log"; then
            stop_gradle "Minecraft could not create a graphics backend"
          fi
          if [ "$SECONDS" -ge "$warn_seconds" ] && [ -z "$warned" ]; then
            warned=1
            echo "::warning::Client GameTests passed 80% of the ${max_seconds} seconds the job deadline left them: rebalance gradle/client-test-weights.txt or add a shard (gradle/ci-budget.txt)"
          fi
          if [ "$SECONDS" -ge "$max_seconds" ]; then
            stop_gradle "Client GameTests out of time: ${setup_seconds} s of setup before the step left ${max_seconds} s of the ${job_deadline}-second job deadline, and the tests ran past it (setup, shard weight or runner speed: gradle/ci-budget.txt)"
          fi
          if [ "$SECONDS" -ge "$deadline" ] \
            && ! grep -q 'Created window using SDL video driver' "$log"; then
            stop_gradle "No Minecraft window after 120 seconds"
          fi
          sleep 2
        done
        status=0
        wait "$gradle_pid" || status=$?
        wait "$tail_pid" || true
        if [ "$status" -ne 0 ]; then
          exit "$status"
        fi
        if ! grep -q 'Using graphics backend OpenGL' "$log"; then
          echo "::error::The client did not use the OpenGL backend that options.txt asks for"
          exit 1
        fi
    # The heap the client JVM used, from its GC log (gradle/run-jvm.gradle.kts): the largest occupancy before any collection is the
    # peak; the live set is the largest occupancy after a Pause Full only, because a young pause leaves garbage in the heap. The
    # per-class histograms force full collections, so the log has them. Size -Xmx for the client run from these.
    - name: Client heap peak
      if: always()
      shell: bash
      run: |
        gclog=build/client-gc.log
        if [ ! -f "$gclog" ]; then
          echo "No $gclog: the client JVM never started."
          exit 0
        fi
        peak=$(grep -oE '[0-9]+[MG]->[0-9]+[MG]\([0-9]+[MG]\)' "$gclog" | awk -F'[>(]' '
          function mb(v) { n = v + 0; return v ~ /G$/ ? n * 1024 : n }
          { sub(/-$/, "", $1); before = mb($1); if (before > peak) peak = before }
          END { printf "%d", peak }')
        live=$(grep 'Pause Full' "$gclog" | grep -oE '[0-9]+[MG]->[0-9]+[MG]\([0-9]+[MG]\)' | awk -F'[>(]' '
          function mb(v) { n = v + 0; return v ~ /G$/ ? n * 1024 : n }
          { after = mb($2); if (after > live) live = after; fulls++ }
          END { if (fulls) printf "largest live set after a full collection %d MB, %d full collections", live, fulls; else printf "no full collection logged" }')
        summary="peak before a collection $peak MB, $live"
        echo "::notice title=Client heap::$summary"
        echo "Client heap: $summary" >> "$GITHUB_STEP_SUMMARY"
    - name: Upload the client GC log
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: client-gc-log${{ inputs.artifact-suffix }}
        path: |
          build/client-gc.log
          build/client-heap
        if-no-files-found: ignore
        retention-days: 7
    # The screenshots the tests took (the failing frame is the last one), for a failure that only the runner shows.
    - name: Upload the test screenshots
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: client-gametest-screenshots${{ inputs.artifact-suffix }}
        path: build/run/clientGameTest/screenshots
        if-no-files-found: ignore
        retention-days: 7
