# Installs ffmpeg from Ubuntu's signed archive without depending on the mirror's speed (#338).
# Restore-only: this action NEVER saves the cache. Callers run PR-controlled code after it
# (record-evidence.yml), and dpkg does not check signatures on cached files, so a save from
# such a job could poison main's scope. Only ffmpeg-seed.yml saves (trusted triggers, no PR code),
# using the outputs below. A miss falls back to a bounded apt install (#290); the logic and its
# source order are in tools/install-ffmpeg.sh.
# GitHub rolls runner images over days, so a job can land on an image newer than the last seed's
# (#771: three runs missed on image 20261018 while main's cache was keyed 20261012, then waited
# 2 x 100 s on the mirror). The restore therefore falls back to the newest entry for the same OS
# (any image, any action hash: the set is only ffmpeg's packages) as the archives dir of the apt
# install, so apt fetches only what differs, from the official mirrors if the runner's stalls (#777).
# The seed turns the fallback off, so it saves a set built on its own image.
name: Install ffmpeg
description: Install ffmpeg from cached Ubuntu .deb files, or by a bounded apt install on a cache miss. Never saves the cache.

inputs:
  allow-stale:
    description: "'true' to fall back to the newest cached .deb set of another runner image; the seed passes 'false'."
    default: "true"

outputs:
  cache-hit:
    description: "'true' when the exact cache key was restored."
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: The cache key for the .deb files.
    value: ${{ steps.cache.outputs.cache-primary-key }}
  debs-dir:
    description: Directory that holds the .deb files after a miss.
    value: ${{ runner.temp }}/ffmpeg-debs

runs:
  using: composite
  steps:
    - name: key the ffmpeg cache on the runner image
      id: image
      shell: bash
      run: |
        if [[ -z ${ImageOS:-} || -z ${ImageVersion:-} ]]; then
          echo "::error::install ffmpeg: the runner sets no ImageOS or ImageVersion, so the cache cannot be keyed on the image"
          exit 1
        fi
        echo "id=$ImageOS-$ImageVersion" >> "$GITHUB_OUTPUT"
        echo "os=$ImageOS" >> "$GITHUB_OUTPUT"
    - name: restore ffmpeg .deb files
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/ffmpeg-debs/*.deb
        key: ffmpeg-debs-${{ steps.image.outputs.id }}-${{ hashFiles('.github/actions/install-ffmpeg/action.yml', 'tools/install-ffmpeg.sh') }}
        restore-keys: ${{ inputs.allow-stale == 'true' && format('ffmpeg-debs-{0}-', steps.image.outputs.os) || '' }}
    - name: install ffmpeg
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        DEBS: ${{ runner.temp }}/ffmpeg-debs
        CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        MATCHED_KEY: ${{ steps.cache.outputs.cache-matched-key }}
      run: "$ACTION_PATH/../../../tools/install-ffmpeg.sh"
