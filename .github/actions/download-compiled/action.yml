# The other half of upload-compiled (#1574): puts build/ and .gradle/ from the compile job into the workspace, after the checkout
# and before the first Gradle call.
name: Download the compile output
description: Download the artifact `name` (see upload-compiled) into the workspace.

inputs:
  name:
    description: The artifact name the compile job uploaded.
    required: true

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.name }}
        path: ${{ github.workspace }}
