# Builds what would merge now: the PR head merged with origin/main as fetched at run time, never GitHub's
# refs/pull/N/merge, which can be hours stale (#979). The caller checks out with
# `ref: github.event.pull_request.head.sha`, fetch-depth 0 and persist-credentials false, then runs this
# once, before any sub-action that builds or tests. It records the main sha it merged in a `merged-main`
# notice annotation on the job's check run: tools/merge-pr.sh reads it through REST
# (`check-runs/<id>/annotations`) and refuses a PR unless it equals the current origin/main.
name: Merge main into the PR head
description: Merge origin/main (fetched now) into the checked-out PR head, check the result and record the main sha.

outputs:
  main-sha:
    description: The origin/main sha that was merged.
    value: ${{ steps.merge.outputs.main-sha }}

runs:
  using: composite
  steps:
    - id: merge
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: tools/ci-merge-main.sh "$HEAD_SHA"
