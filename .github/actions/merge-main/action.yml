# Builds what would merge now: the PR head merged with origin/main as fetched at run time, never GitHub's
# refs/pull/N/merge, which can be hours stale (#979). The workflow checks out the PR head (fetch-depth 0), then
# uses this action as `pkeppeler/deepcharter/.github/actions/merge-main@main`. The runner downloads the whole
# repo at that ref outside the workspace, so tools/ci-merge-main.sh is main's copy and a head cannot swap it.
# It runs once, before any sub-action that builds or tests, and records the merged main sha in a `merged-main`
# notice annotation that tools/merge-pr.sh reads through REST.
name: Merge main into the PR head
description: Merge origin/main (fetched now) into the checked-out PR head, check the result and record the main sha.

inputs:
  main-sha:
    description: Merge exactly this origin/main commit, picked once per workflow run by a setup job (#1571). Empty means the tip of main now.
    required: false
    default: ""

outputs:
  main-sha:
    description: The origin/main sha that was merged.
    value: ${{ steps.merge.outputs.main-sha }}

runs:
  using: composite
  steps:
    - id: merge
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MAIN_SHA: ${{ inputs.main-sha }}
      run: |
        "$GITHUB_ACTION_PATH/../../../tools/ci-merge-main.sh" "$HEAD_SHA" ${MAIN_SHA:+"$MAIN_SHA"}
