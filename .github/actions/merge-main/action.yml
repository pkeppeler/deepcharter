# Builds what would merge now: the PR head merged with origin/main as fetched at run time, never GitHub's
# refs/pull/N/merge, which can be hours stale (#979). The workflow checks out the PR head (fetch-depth 0), then
# main's copy of this action and tools/ci-merge-main.sh into .ci-main, so a branch cut before this existed
# still runs it and a head cannot swap the script. It runs once, before any sub-action that builds or tests,
# and records the merged main sha in a `merged-main` notice annotation that tools/merge-pr.sh reads through REST.
name: Merge main into the PR head
description: Merge origin/main (fetched now) into the checked-out PR head, check the result and record the main sha.

outputs:
  main-sha:
    description: The origin/main sha that was merged.
    value: ${{ steps.merge.outputs.main-sha }}

runs:
  using: composite
  steps:
    - id: merge
      shell: bash
      env:
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        # .ci-main is main's copy of this action, not part of the PR: keep it out of git's view.
        echo "/.ci-main" >> "$(git rev-parse --git-path info/exclude)"
        "$GITHUB_ACTION_PATH/../../../tools/ci-merge-main.sh" "$HEAD_SHA"
