# Weekly, so new advisories land on unchanged code, and on PRs that touch dependency files.
# The merge gate (tools/merge-pr.sh) blocks on any failed check on the head sha, so this
# must not run on unrelated PRs: a new advisory would make every open PR unmergeable.
name: audit

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - gradle.lockfile
      - buildscript-gradle.lockfile
      - settings-gradle.lockfile
      - gradle/verification-metadata.xml
      - osv-scanner.toml
      - justfile
      - .github/workflows/audit.yml

permissions:
  contents: read

concurrency:
  group: audit-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: just,osv-scanner
      - run: just audit
