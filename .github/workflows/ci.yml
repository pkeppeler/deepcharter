# Runs on every PR. Label events are deliberately not triggers here (they live in
# client-tests.yml), so adding a label never re-runs or cancels the build.
# The job names below are the REQUIRED_CHECKS in tools/merge-pr.sh; renaming one
# means changing both.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      # Reads the cache seeded on main (cache-seed.yml); writable so later pushes to
      # the same PR also reuse what this run built.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
      - run: ./gradlew build
      - name: room-carver gate check
        run: python3 -I tools/tests/room_carver_gate_check.py
      - name: client-test filter check
        run: python3 -I tools/tests/client_filter_gate_check.py
      - name: tick-wait gate check
        run: python3 -I tools/tests/tick_wait_gate_check.py
      # The client run tasks never run on Linux. A dry run with the lock forced on still checks that
      # they serialize into the configuration cache (gradle/clientlock.gradle).
      - run: ./gradlew runClient runClientGameTest runPlay --dry-run --configuration-cache
        env:
          DEEPCHARTER_CLIENT_LOCK: "1"

  tool-tests:
    name: tool-tests
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15 # tests take ~2.5 min; leave headroom over the capped 4-min ffmpeg install
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # build-audio-pack.test.sh needs ffmpeg. It makes its own synthetic tones; CI never
      # has, reads or needs the original game audio.
      - name: install ffmpeg
        # A slow apt mirror once ate 471 s of the job budget (#290): bound each attempt, retry once, cap the step.
        timeout-minutes: 4
        run: |
          # Skip the recommended packages (GUI, audio, GPU) the tones test never uses.
          # First try has no index update; the retry refreshes the index.
          if ! timeout -k 5 100 sudo apt-get install -o DPkg::Lock::Timeout=20 -y -q --no-install-recommends ffmpeg; then
            echo "::warning::ffmpeg install failed or timed out; retrying after an index update"
            timeout -k 5 40 sudo apt-get update -q || true
            timeout -k 5 90 sudo apt-get install -o DPkg::Lock::Timeout=20 -y -q --no-install-recommends ffmpeg
          fi
      - run: python3 -I -m unittest discover -s tools/tests -p 'test_*.py'
      - name: bash tool tests
        run: |
          for t in tools/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error::$t failed"; exit 1; }
            echo "::endgroup::"
          done
      - name: shellcheck (pinned in tools/shellcheck.sh)
        run: |
          tools/shellcheck.sh install "$RUNNER_TEMP/shellcheck"
          export PATH="$RUNNER_TEMP/shellcheck:$PATH"
          shellcheck --version
          tools/shellcheck.sh
