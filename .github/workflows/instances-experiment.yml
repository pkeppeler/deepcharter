# TEMPORARY (#1722): measures N client JVMs per job on real runners. Deleted before the PR leaves draft.
name: Instances experiment

on:
  push:
    branches: [1722-parallel-instances]

permissions:
  contents: read

jobs:
  compile:
    name: exp-compile
    if: contains(github.event.head_commit.message, '[exp]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: tools/ci-gradle-resolve.sh classes clientClasses gametestClasses resolveClientGameTestRuntime
      - run: tools/ci-reuse-compiled.sh record
      - uses: ./.github/actions/upload-compiled
        with:
          name: compiled-exp

  server:
    name: srv ${{ matrix.shards }} rep ${{ matrix.rep }}
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        rep: [1, 2]
        shards: ["1", "2", "3", "4", "1 2", "3 4"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: nohup vmstat 5 > "$RUNNER_TEMP/vmstat.log" 2>&1 &
      - id: compiled
        uses: ./.github/actions/download-compiled
        with:
          name: compiled-exp
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - env:
          SHARDS: ${{ matrix.shards }}
          SKIP_COMPILE: ${{ steps.compiled.outputs.skip }}
        # shellcheck disable=SC2086
        run: |
          tools/ci-gradle-resolve.sh help
          dirs=()
          for s in $SHARDS; do
            d="$RUNNER_TEMP/ws-$s"
            cp -a "$GITHUB_WORKSPACE" "$d"
            dirs+=("$d")
          done
          start=$(date +%s)
          pids=()
          for s in $SHARDS; do
            (cd "$RUNNER_TEMP/ws-$s" && ./gradlew runGameTest -PgametestShard="$s/32" $SKIP_COMPILE 2>&1 | sed -u "s|^|[server $s] |") &
            pids+=($!)
          done
          status=0
          for p in "${pids[@]}"; do wait "$p" || status=1; done
          echo "SERVER-PAIR-WALL $(( $(date +%s) - start )) s for shards $SHARDS"
          exit "$status"
      - if: always()
        run: cat "$RUNNER_TEMP/vmstat.log"
