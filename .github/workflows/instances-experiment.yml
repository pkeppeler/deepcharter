# TEMPORARY (#1722): measures N client JVMs per job on real runners. Deleted before the PR leaves draft.
name: Instances experiment

on:
  push:
    branches: [1722-parallel-instances]

permissions:
  contents: read

jobs:
  compile:
    name: exp-compile
    if: contains(github.event.head_commit.message, '[exp]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - run: tools/ci-gradle-resolve.sh classes clientClasses gametestClasses resolveClientGameTestRuntime
      - run: tools/ci-reuse-compiled.sh record
      - uses: ./.github/actions/upload-compiled
        with:
          name: compiled-exp

  run:
    name: exp n=${{ matrix.n }} ${{ matrix.slice }} rep ${{ matrix.rep }} lp${{ matrix.lp }} cpu${{ matrix.cpus }}
    needs: compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { n: 1, slice: a, lp: "", cpus: "", rep: 1 }
          - { n: 1, slice: b, lp: "", cpus: "", rep: 1 }
          - { n: 1, slice: c, lp: "", cpus: "", rep: 1 }
          - { n: 1, slice: d, lp: "", cpus: "", rep: 1 }
          - { n: 2, slice: ab, lp: "", cpus: "", rep: 1 }
          - { n: 2, slice: cd, lp: "", cpus: "", rep: 1 }
          - { n: 2, slice: ab, lp: "2", cpus: "2", rep: 1 }
          - { n: 2, slice: cd, lp: "2", cpus: "2", rep: 1 }
          - { n: 2, slice: ab, lp: "2", cpus: "2", rep: 2 }
          - { n: 2, slice: cd, lp: "2", cpus: "2", rep: 2 }
          - { n: 2, slice: ab, lp: "1", cpus: "2", rep: 1 }
          - { n: 2, slice: cd, lp: "1", cpus: "2", rep: 1 }
          - { n: 3, slice: abc, lp: "1", cpus: "1", rep: 1 }
          - { n: 3, slice: abc, lp: "1", cpus: "2", rep: 1 }
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: classes
        env:
          SLICE: ${{ matrix.slice }}
        run: |
          declare -A part=(
            [a]=BeamsClientTest,BlockReadoutClientTest,BreachCrossingClientTest
            [b]=CatalogueEffectsClientTest,CatalogueMaterialsClientTest,CatalogueToggleClientTest
            [c]=CockpitTitlesClientTest,ContractTerminalClientTest,HandbookPageFlowClientTest
            [d]=OreProcessorClientTest,PodMovementClientTest,RecipeFillClientTest
          )
          list=
          for ((i = 0; i < ${#SLICE}; i++)); do list="${list:+$list,}${part[${SLICE:$i:1}]}"; done
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - env:
          LP: ${{ matrix.lp }}
          CPUS: ${{ matrix.cpus }}
        run: |
          if [ -n "$LP" ]; then echo "LP_NUM_THREADS=$LP" >> "$GITHUB_ENV"; fi
          if [ -n "$CPUS" ]; then echo "CLIENT_INSTANCE_CPUS=$CPUS" >> "$GITHUB_ENV"; fi
      - run: nohup vmstat 5 > "$RUNNER_TEMP/vmstat.log" 2>&1 &
      - id: compiled
        uses: ./.github/actions/download-compiled
        with:
          name: compiled-exp
      - uses: ./.github/actions/client-gametest
        with:
          job-start: ${{ env.JOB_START }}
          skip-compile: ${{ steps.compiled.outputs.skip }}
          client-tests: ${{ steps.classes.outputs.list }}
          client-instances: ${{ matrix.n }}
          gradle-cache-read-only: "true"
          artifact-suffix: -exp-${{ matrix.n }}-${{ matrix.slice }}-${{ matrix.rep }}
      - if: always()
        run: cat "$RUNNER_TEMP/vmstat.log"
      - if: always()
        run: echo "JOB_END=$(( $(date +%s) - JOB_START )) s after the job start"
