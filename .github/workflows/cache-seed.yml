# Seeds the Gradle cache on main, which PR runs can read (a PR's own caches are
# invisible to other PRs). Main never runs the real CI, so this fires only when a
# Gradle input changes, or by hand. `classes` resolves dependencies and sets up
# Minecraft (Loom's download, merge and remap) for every source set, without
# running any tests. `downloadAssets` fetches Minecraft's asset objects, which the
# job saves as their own entry for the client runs (.github/actions/loom-assets, #1703).
name: Cache seed

on:
  push:
    branches: [main]
    paths:
      - build.gradle.kts
      - settings.gradle.kts
      - gradle.properties
      - gradle/**
      - .github/workflows/cache-seed.yml
      - .github/actions/loom-assets/**
  workflow_dispatch:

concurrency:
  group: cache-seed
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job id must stay `build`: setup-gradle's Gradle User Home cache key includes
  # the job id, and ci.yml's build shards' job id is `build`. Its restore keys then match this entry
  # as "most recent entry saved for the same OS and job id" (and, failing that, the
  # same OS), falling back from the PR branch to main. See
  # docs/setup-gradle.md, "Cache keys" and "Finding a matching cache entry", at
  # gradle/actions 3f5f9ada. The workflow name differs, so the closer tier misses.
  build:
    name: seed
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
          # The asset objects go in their own entry, below, which only the client runs restore.
          gradle-home-cache-excludes: caches/fabric-loom/assets
      # No fallback to another version's set: the entry saved below holds exactly this version's objects.
      - id: assets
        uses: ./.github/actions/loom-assets
        with:
          allow-stale: "false"
      # Restores main's previous entry, so a broken one would otherwise stay broken (#830); also retries a
      # repository or an asset download that fails to answer (#1358, #1703).
      - run: tools/ci-gradle-resolve.sh classes downloadAssets
      - name: Loom assets fetched
        env:
          ASSETS: ${{ steps.assets.outputs.path }}
          RESTORED: ${{ steps.assets.outputs.objects }}
        run: |
          objects=$(find "$ASSETS/objects" -type f 2>/dev/null | wc -l)
          echo "::notice title=Loom assets::downloadAssets fetched $((objects - RESTORED)) objects from Mojang ($RESTORED restored from the cache, $objects on disk)"
      # A hit saves nothing: the key is the Minecraft version, and its asset set does not change.
      - name: Save the Loom assets
        if: steps.assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.assets.outputs.path }}
          key: ${{ steps.assets.outputs.cache-key }}
