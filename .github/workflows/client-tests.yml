# Client GameTests for PRs that change game behaviour (src/main, src/client, src/gametest, src/lang) or
# carry the `gameplay` label, the manual override (tools/ci-client-needed.sh decides, #885). Separate from
# ci.yml so the `labeled` trigger exists only here: any other label starts this run with its jobs
# skipped (no runner, seconds), and never touches the build.
name: Client tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

# Runs that can do real work (same condition as the `changes` job's `if`) share one group
# per PR, so a PR opened with `gameplay` set runs the client tests once, not once
# for `opened` and once for `labeled`. Runs that will skip (any other label, added
# mid-run by the pipeline) get a group of their own, so they cannot cancel a real run.
concurrency:
  group: >-
    ${{ (!github.event.pull_request.draft
    && (github.event.action != 'labeled' || github.event.label.name == 'gameplay'))
    && format('client-{0}', github.event.pull_request.number)
    || format('client-{0}-skip-{1}', github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The shards of a full run; a PR-tier run takes as many as its classes need (the changes job).
  CLIENT_SHARDS: 30

jobs:
  changes:
    name: client-changes
    # Not a draft, and for a label event, the label added is gameplay.
    if: >-
      ${{ !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'gameplay') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
      main-sha: ${{ steps.merge.outputs.main-sha }}
      client-full: ${{ steps.plan.outputs.client-full }}
      client-classes: ${{ steps.plan.outputs.client-classes }}
      client-count: ${{ steps.plan.outputs.client-count }}
      client-matrix: ${{ steps.plan.outputs.client-matrix }}
    steps:
      # The PR head merged with the real main (#979): main-sha..HEAD is exactly the PR's changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: merge
        uses: pkeppeler/deepcharter/.github/actions/merge-main@main
      - id: decide
        env:
          GAMEPLAY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'gameplay') && '1' || '0' }}
          MAIN_SHA: ${{ steps.merge.outputs.main-sha }}
        run: |
          git diff --no-renames --name-only "$MAIN_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "run=$(tools/ci-client-needed.sh "$GAMEPLAY_LABEL" < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"
      # Which client classes the change can affect, or the whole suite (tools/ci_affected.py, ADR 0116). Unread when `run` is false.
      - uses: ./.github/actions/setup-python-uv
      - id: plan
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          tools/py tools/ci_affected.py --head-ref "$HEAD_REF" --labels "$LABELS" \
            --server-shards 1 --client-shards "$CLIENT_SHARDS" < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

  # Compiles every source set once and hands build/ and .gradle/ to the shards (.github/actions/upload-compiled), so no shard spends a
  # minute or two of its five compiling and the client's run tasks have their launch files ready.
  compile:
    name: client-compile
    needs: changes
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.client-count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: pkeppeler/deepcharter/.github/actions/merge-main@main
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: false
      - run: tools/ci-gradle-resolve.sh classes clientClasses gametestClasses resolveClientGameTestRuntime
      # The shards skip their compile tasks only if their merged tree has these compile inputs (tools/ci-reuse-compiled.sh).
      - run: tools/ci-reuse-compiled.sh record
      - uses: ./.github/actions/upload-compiled
        with:
          name: compiled-client

  # The suite runs as CLIENT_SHARDS parallel jobs, each its own runner and Minecraft client. Each takes the
  # shard `i/n` of the client classes that gradle/gametest.gradle.kts picks by weight (-PclientShard), so every class
  # runs in exactly one shard. The matrix and CLIENT_SHARDS must agree: tools/tests/test_client_shards.py checks it.
  client-shard:
    name: client-gametest-shard ${{ matrix.shard }}
    needs: [changes, compile]
    if: needs.changes.outputs.run == 'true' && needs.changes.outputs.client-count != '0'
    runs-on: ubuntu-latest
    # One shard holds at most gradle/ci-budget.txt's client-shard seconds of tests by measured weight (tools/tests/test_ci_budget.py checks it).
    # The action's own deadline (200 s of test time) ends the run with a message before this limit would kill it silently.
    timeout-minutes: 5
    strategy:
      fail-fast: false
      # At most this many shards at once, so a full run leaves runners for other PRs' runs (ADR 0115).
      max-parallel: 10
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.client-matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: merge
        uses: pkeppeler/deepcharter/.github/actions/merge-main@main
      - uses: ./.github/actions/upload-merged-main
        with:
          main-sha: ${{ steps.merge.outputs.main-sha }}
          name: ${{ matrix.shard }}
      - id: compiled
        uses: ./.github/actions/download-compiled
        with:
          name: compiled-client
      - uses: ./.github/actions/client-gametest
        with:
          skip-compile: ${{ steps.compiled.outputs.skip }}
          client-shard: ${{ matrix.shard }}/${{ needs.changes.outputs.client-count }}
          client-tests: ${{ needs.changes.outputs.client-classes }}
          gradle-cache-read-only: "true"
          artifact-suffix: -${{ matrix.shard }}

  # The one name tools/merge-pr.sh requires for the suite (#1079). Succeeds only when every shard did; skipped
  # when the shards were (the changes job decided no run), which the gate reads as "skipping" like any skipped run.
  # It also records the shards' agreed `merged-main` notice (tools/ci-shard-main.sh), for the gate on main. It never
  # merges main itself (that could record a sha the shards did not test).
  client-gametest:
    name: client-gametest
    needs: [changes, compile, client-shard]
    if: ${{ always() && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # With no class selected (the PR tier, ADR 0116) the compile job and the shards are skipped, and that is a pass.
      - env:
          COUNT: ${{ needs.changes.outputs.client-count }}
          COMPILE: ${{ needs.compile.result }}
          SHARDS: ${{ needs.client-shard.result }}
        run: |
          if [ "$COUNT" != 0 ] && { [ "$COMPILE" != success ] || [ "$SHARDS" != success ]; }; then
            echo "::error::client-compile finished as '$COMPILE' and the client shards as '$SHARDS' ($COUNT selected), not both success"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: tools/ci-shard-main.sh
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .ci-main
          sparse-checkout: tools/ci-shard-main.sh
          persist-credentials: false
      # bootstrap-1093: until main has the script, use the PR's own copy. Delete this step once #1093 is on main.
      - shell: bash
        run: |
          if [ ! -f .ci-main/tools/ci-shard-main.sh ]; then
            mkdir -p .ci-main/tools
            cp tools/ci-shard-main.sh .ci-main/tools/
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.changes.outputs.client-count != '0'
        with:
          pattern: merged-main-*
          merge-multiple: true
          path: ${{ runner.temp }}/shard-main
      # The shards that ran merged one main; with none, the changes job's main is the one this run tested.
      - env:
          COUNT: ${{ needs.changes.outputs.client-count }}
          MAIN_SHA: ${{ needs.changes.outputs.main-sha }}
        run: |
          if [ "$COUNT" = 0 ]; then
            echo "::notice title=merged-main::$MAIN_SHA"
          else
            .ci-main/tools/ci-shard-main.sh "$RUNNER_TEMP/shard-main" "$COUNT"
          fi
      # What ran, for tools/merge-pr.sh: it lands only a head whose client suite ran whole (ADR 0116).
      - env:
          FULL: ${{ needs.changes.outputs.client-full }}
        run: echo "::notice title=ci-tier::$([ "$FULL" = true ] && echo full || echo pr)"
