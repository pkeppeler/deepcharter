# Client GameTests, only for PRs labelled `gameplay`. Separate from ci.yml so the
# `labeled` trigger exists only here: any other label starts this run with its job
# skipped (no runner, seconds), and never touches the build.
name: Client tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

# Runs that will do real work (same condition as the job's `if`) share one group
# per PR, so a PR opened with `gameplay` set runs the client tests once, not once
# for `opened` and once for `labeled`. Runs that will skip (any other label, added
# mid-run by the pipeline) get a group of their own, so they cannot cancel a real run.
concurrency:
  group: >-
    ${{ (!github.event.pull_request.draft
    && contains(github.event.pull_request.labels.*.name, 'gameplay')
    && (github.event.action != 'labeled' || github.event.label.name == 'gameplay'))
    && format('client-{0}', github.event.pull_request.number)
    || format('client-{0}-skip-{1}', github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client-gametest:
    name: client-gametest
    # Not a draft, labelled gameplay, and for a label event, the label added is gameplay.
    if: >-
      ${{ !github.event.pull_request.draft
      && contains(github.event.pull_request.labels.*.name, 'gameplay')
      && (github.event.action != 'labeled' || github.event.label.name == 'gameplay') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # No X server: with no DISPLAY, SDL3 (Minecraft 26.3 sets no video driver of its
      # own) cannot use x11 or wayland, so it uses its offscreen driver, which gets
      # an OpenGL context from EGL. Naming it keeps a stray DISPLAY from changing that.
      SDL_VIDEO_DRIVER: offscreen
      # Mesa software rendering (llvmpipe): the runner has no GPU.
      LIBGL_ALWAYS_SOFTWARE: "1"
      RUN_DIR: build/run/clientGameTest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false
      # EGL and Mesa's software GL driver, for SDL's offscreen video driver.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri
      # One backend, not a matrix, to save minutes. `version` is the data version that
      # stops Minecraft's datafixer from resetting the backend to its default
      # (OptionsForceDefaultGraphicsApiFix).
      - name: Choose the OpenGL backend
        run: |
          mkdir -p "$RUN_DIR"
          printf 'version:4896\npreferredGraphicsBackend:"opengl"\n' > "$RUN_DIR/options.txt"
      # Minecraft logs "Failed to create backend" and then hangs, so watch the log and
      # fail the job at once. With one backend in the options, one such line is fatal.
      # -x deleteGameTestRunDir: Loom deletes the run dir first, which would delete options.txt.
      - name: Client GameTests
        run: |
          log="$RUNNER_TEMP/client-gametest.log"
          ./gradlew runClientGameTest -x deleteGameTestRunDir > "$log" 2>&1 &
          gradle_pid=$!
          tail -n +1 -f "$log" --pid="$gradle_pid" &
          while kill -0 "$gradle_pid" 2>/dev/null; do
            if grep -q 'Failed to create backend' "$log"; then
              echo "::error::Minecraft could not create a graphics backend"
              kill "$gradle_pid"
              exit 1
            fi
            sleep 2
          done
          wait "$gradle_pid"
        timeout-minutes: 15
