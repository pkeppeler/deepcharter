# Client GameTests for PRs that change game behaviour (src/main, src/client, src/gametest, src/lang) or
# carry the `gameplay` label, the manual override (tools/ci-client-needed.sh decides, #885). Separate from
# ci.yml so the `labeled` trigger exists only here: any other label starts this run with its jobs
# skipped (no runner, seconds), and never touches the build.
name: Client tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]

# Runs that can do real work (same condition as the `changes` job's `if`) share one group
# per PR, so a PR opened with `gameplay` set runs the client tests once, not once
# for `opened` and once for `labeled`. Runs that will skip (any other label, added
# mid-run by the pipeline) get a group of their own, so they cannot cancel a real run.
concurrency:
  group: >-
    ${{ (!github.event.pull_request.draft
    && (github.event.action != 'labeled' || github.event.label.name == 'gameplay'))
    && format('client-{0}', github.event.pull_request.number)
    || format('client-{0}-skip-{1}', github.event.pull_request.number, github.run_id) }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLIENT_SHARDS: 6

jobs:
  changes:
    name: client-changes
    # Not a draft, and for a label event, the label added is gameplay.
    if: >-
      ${{ !github.event.pull_request.draft
      && (github.event.action != 'labeled' || github.event.label.name == 'gameplay') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      # The PR head merged with the real main (#979): main-sha..HEAD is exactly the PR's changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        uses: pkeppeler/deepcharter/.github/actions/merge-main@main
      - id: decide
        env:
          GAMEPLAY_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'gameplay') && '1' || '0' }}
          MAIN_SHA: ${{ steps.merge.outputs.main-sha }}
        run: |
          git diff --no-renames --name-only "$MAIN_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "run=$(tools/ci-client-needed.sh "$GAMEPLAY_LABEL" < "$RUNNER_TEMP/changed.txt")" >> "$GITHUB_OUTPUT"

  # The suite runs as CLIENT_SHARDS parallel jobs, each its own runner and Minecraft client. Each takes the
  # shard `i/n` of the client classes that gradle/gametest.gradle.kts picks by weight (-PclientShard), so every class
  # runs in exactly one shard. The matrix and CLIENT_SHARDS must agree: tools/tests/test_client_shards.py checks it.
  client-shard:
    name: client-gametest-shard ${{ matrix.shard }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # One shard is ~1/6 of the suite by measured weight (gradle/client-test-weights.txt): about 10-14 minutes of tests (the weights total about 600 s per shard), with 3 minutes of setup before it.
    # The action's own deadline is 20 minutes of test time; this leaves room for setup and the post steps.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: merge
        uses: pkeppeler/deepcharter/.github/actions/merge-main@main
      - uses: ./.github/actions/upload-merged-main
        with:
          main-sha: ${{ steps.merge.outputs.main-sha }}
          name: ${{ matrix.shard }}
      - uses: ./.github/actions/client-gametest
        with:
          client-shard: ${{ matrix.shard }}/${{ env.CLIENT_SHARDS }}
          artifact-suffix: -${{ matrix.shard }}

  # The one name tools/merge-pr.sh requires for the suite (#1079). Succeeds only when every shard did; skipped
  # when the shards were (the changes job decided no run), which the gate reads as "skipping" like any skipped run.
  # It also records the shards' agreed `merged-main` notice (tools/ci-shard-main.sh), for the gate on main. It never
  # merges main itself (that could record a sha the shards did not test).
  client-gametest:
    name: client-gametest
    needs: [changes, client-shard]
    if: ${{ always() && needs.changes.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SHARDS: ${{ needs.client-shard.result }}
        run: |
          if [ "$SHARDS" != success ]; then
            echo "::error::The client shards finished as '$SHARDS', not success"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          sparse-checkout: tools/ci-shard-main.sh
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: .ci-main
          sparse-checkout: tools/ci-shard-main.sh
          persist-credentials: false
      # bootstrap-1093: until main has the script, use the PR's own copy. Delete this step once #1093 is on main.
      - shell: bash
        run: |
          if [ ! -f .ci-main/tools/ci-shard-main.sh ]; then
            mkdir -p .ci-main/tools
            cp tools/ci-shard-main.sh .ci-main/tools/
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: merged-main-*
          merge-multiple: true
          path: ${{ runner.temp }}/shard-main
      - run: .ci-main/tools/ci-shard-main.sh "$RUNNER_TEMP/shard-main" "$CLIENT_SHARDS"
