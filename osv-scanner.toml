# Packages whose license is outside the allow-list, or missing or non-SPDX in the registry. All are build-time or test-only,
# except GeckoLib (jar-in-jar). `license.ignore` skips only the license check. A shipped package gets an entry only when its
# real license is allowed (GeckoLib: MIT). A new failing package gets its own entry naming it and its license.

[[PackageOverrides]]
name = ".+\\.gradle\\.plugin"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Gradle plugin marker artifacts carry no license metadata; build-time only"

[[PackageOverrides]]
name = "(org\\.gradle\\.toolchains:foojay-resolver|org\\.sonatype\\.oss:oss-parent)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Settings plugin and parent POM with no license metadata; build-time only"

[[PackageOverrides]]
name = "(org\\.tukaani:xz|org\\.functionaljava:functionaljava|com\\.uber\\.nullaway:nullaway|org\\.pcollections:pcollections|org\\.checkerframework:checker-qual|org\\.mockito:mockito-bom)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Public Domain, BSD3 or MIT, but the registry reports a non-SPDX name; build-time only"

[[PackageOverrides]]
name = "(io\\.github\\.eisop:dataflow-errorprone|org\\.checkerframework:dataflow-nullaway)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "GPL-2.0 with classpath exception, Error Prone and NullAway annotation-processor path only, never shipped"

[[PackageOverrides]]
name = "(dev\\.equo\\.ide:solstice|org\\.junit(\\.jupiter|\\.platform)?:(junit-bom|junit-jupiter-api|junit-jupiter-engine|junit-platform-commons|junit-platform-engine|junit-platform-launcher))"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "EPL-2.0 (allowed), but the registry reports its name as non-SPDX; Spotless build-time and test-only, never shipped"

[[PackageOverrides]]
name = "(net\\.fabricmc\\.fabric-api:(fabric-advancement-api-v1|fabric-api|fabric-api-base|fabric-api-deprecated|fabric-api-lookup-api-v1|fabric-biome-api-v1|fabric-block-api-v1|fabric-block-getter-api-v2|fabric-client-gametest-api-v1|fabric-command-api-v2|fabric-content-registries-v0|fabric-convention-tags-v2|fabric-crash-report-info-v1|fabric-creative-tab-api-v1|fabric-data-attachment-api-v1|fabric-data-generation-api-v1|fabric-debug-api-v1|fabric-dimensions-v1|fabric-entity-events-v1|fabric-events-interaction-v0|fabric-game-rule-api-v1|fabric-gametest-api-v1|fabric-item-api-v1|fabric-key-mapping-api-v1|fabric-lifecycle-events-v1|fabric-loot-api-v3|fabric-menu-api-v1|fabric-message-api-v1|fabric-model-loading-api-v1|fabric-networking-api-v1|fabric-object-builder-api-v1|fabric-particles-v1|fabric-permission-api-v1|fabric-recipe-api-v1|fabric-registry-sync-v0|fabric-renderer-api-v1|fabric-renderer-indigo|fabric-rendering-fluids-v1|fabric-rendering-v1|fabric-resource-conditions-api-v1|fabric-resource-loader-v0|fabric-resource-loader-v1|fabric-screen-api-v1|fabric-serialization-api-v1|fabric-sound-api-v1|fabric-tag-api-v1|fabric-transfer-api-v1|fabric-transitive-access-wideners-v1))"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Apache-2.0 Fabric API modules; the published POMs carry no license. The player's Fabric API install provides them; not shipped"

[[PackageOverrides]]
name = "(net\\.fabricmc:(fabric-loader|class-tweaker|dev-launch-injector|stitch|tiny-mappings-parser))"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Apache-2.0 Fabric Loader and Loom tooling; the published POMs carry no license. The player's Loader provides Loader; the rest is build-time only"

[[PackageOverrides]]
name = "(net\\.fabricmc:(fabric-loom|lorenz-tiny|cfr|sponge-mixin)|net\\.fabricmc\\.unpick:(unpick|unpick-format-utils)|net\\.sf\\.jopt-simple:jopt-simple|com\\.azure:(azure-json|azure-sdk-parent|azure-client-sdk-parent)|org\\.bouncycastle:bc-jdk18on-bom)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "MIT per the published POMs for sponge-mixin, jopt-simple and the azure-* artifacts, per the Fabric repositories for fabric-loom, lorenz-tiny, cfr and unpick, and the Bouncy Castle Licence (an MIT variant) for the BOM. The registry reports none or a non-SPDX name. Loom's tools are build-time only; Mixin and the Minecraft libraries come with the game"

[[PackageOverrides]]
name = "(net\\.fabricmc:tiny-remapper)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "LGPL-3.0 Loom remapping tool, build-time only, never linked into or shipped with the mod"

[[PackageOverrides]]
name = "(net\\.fabricmc:(mercury|mercurymixin)|org\\.eclipse\\.ee4j:project|jakarta\\.platform:(jakarta\\.jakartaee-bom|jakartaee-api-parent))"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Registry reports no license or a non-SPDX name. The POMs say EPL-2.0 (mercury; Jakarta EE parent POMs, with the ee4j project dual-licensed GPL-2.0 with Classpath Exception) and MPL-2.0 (mercurymixin). Loom's tool classpath and parent POMs, build-time only"

[[PackageOverrides]]
name = "(net\\.fabricmc:fabric-log4j-util)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "License not published; Fabric's log4j console helper that Loader depends on, used by development runs only"

[[PackageOverrides]]
name = "(com\\.mojang:(authlib|blocklist|jtracy|logging|patchy|text2speech)|net\\.minecraft:minecraft-merged-deobf)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Mojang libraries and the Loom-generated Minecraft jar under the Minecraft EULA; the POMs carry no license. The game provides them; not shipped"

[[PackageOverrides]]
name = "(com\\.mojang:(brigadier|datafixerupper))"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "MIT (the published sources); the POMs carry no license. The game provides them; not shipped"

[[PackageOverrides]]
name = "(net\\.java\\.dev\\.jna:(jna|jna-platform))"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Dual-licensed LGPL-2.1-or-later or Apache-2.0 (the JNA POM); we take Apache-2.0. A Minecraft runtime library the game provides; not shipped"

[[PackageOverrides]]
name = "(org\\.jcraft:jorbis|com\\.ibm\\.icu:icu4j)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "LGPL (jorbis) and Unicode-3.0 (ICU4J), neither on the allow-list. Minecraft runtime libraries the game provides; not shipped"

[[PackageOverrides]]
name = "(com\\.geckolib:geckolib-fabric-26\\.3)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "MIT, shipped (jar-in-jar via include): the registry reports no license, but the jar's LICENSE.txt and fabric.mod.json say MIT, \"Copyright (c) 2026 GeckoLib\" (docs/tooling/geckolib-audit.md, Licence)"

[[PackageOverrides]]
name = "(net\\.minecraft:minecraft-(common|clientOnly)-[0-9a-f]{10})"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Loom-generated Minecraft jars (the name carries a hash) under the Minecraft EULA; no license is published. The game provides them; not shipped"

[[PackageOverrides]]
name = "(com\\.puppycrawl\\.tools:checkstyle|net\\.sf\\.saxon:Saxon-HE|org\\.javassist:javassist|org\\.reflections:reflections)"
nameIsRegex = true
ecosystem = "Maven"
license.ignore = true
reason = "Checkstyle tool classpath, build-time only, never shipped: Checkstyle is LGPL-2.1-or-later, Saxon-HE is MPL-2.0, javassist is MPL-1.1 or LGPL-2.1 or Apache-2.0, reflections is WTFPL"

[[IgnoredVulns]]
id = "GHSA-343h-94h5-c4wr"
ignoreUntil = 2026-12-13
reason = "lz4-java 1.10.1: LZ4BlockInputStream with stopOnEmptyBlock=false recurses once per empty block, causing StackOverflowError. Mojang pins this library in Minecraft 26.3's manifest, so only a Minecraft update changes it; it is on the dev and test classpath, and the player's game ships its own copy"

