plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'checkstyle'
}

group = project.maven_group

loom {
	splitEnvironmentSourceSets()

	mods {
		"deepcharter" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

	runs {
		// Play-test client. Its own run dir, so the mcpfabric jar that tools/play.sh
		// places in run/play/mods is loaded here and nowhere else (audit condition 1).
		play {
			client()
			runDir "run/play"
			programArgs "--quickPlaySingleplayer", "deepcharter-playtest", "--width", "854", "--height", "480"
		}
		// Throwaway dedicated server that tools/play.sh uses once to generate the
		// test world template (quick play cannot create a missing world).
		playWorld {
			server()
			runDir "run/play-world"
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "deepcharter-test"
		enableGameTests = true
		enableClientGameTests = true
		eula = true
	}
}

repositories {
	// Only GeckoLib comes from here, and only this repository may serve it (audit condition 3).
	exclusiveContent {
		forRepository {
			maven {
				name = "GeckoLib"
				url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
			}
		}
		filter {
			includeGroup "com.geckolib"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Pod models (ADR 0030). The jar is nested in ours, so a player installs nothing extra (audit condition 4).
	implementation "com.geckolib:geckolib-fabric-26.3:${project.geckolib_version}"
	include "com.geckolib:geckolib-fabric-26.3:${project.geckolib_version}"
}

// Audit condition 2: the resolved GeckoLib jar must be the audited one. Gradle has no dependency verification here, so a
// changed jar (a re-upload, a swapped repository) fails the build before it is packed into ours.
abstract class CheckGeckoLib extends DefaultTask {
	@InputFiles
	abstract ConfigurableFileCollection getJars()

	@Input
	abstract Property<String> getSha512()

	@TaskAction
	void check() {
		def found = jars.files.findAll { it.name.startsWith("geckolib-fabric-") }
		if (found.size() != 1) {
			throw new GradleException("expected exactly one GeckoLib jar on the runtime classpath, found ${found.collect { it.name }}")
		}
		def digest = java.security.MessageDigest.getInstance("SHA-512").digest(found[0].bytes).encodeHex().toString()
		if (digest != sha512.get()) {
			throw new GradleException("${found[0].name} has sha512 ${digest}, but gradle.properties pins ${sha512.get()}. "
				+ "A new GeckoLib is a new audit (docs/tooling/geckolib-audit.md): repeat its hash and source checks, then update the pin.")
		}
	}
}

def checkGeckoLib = tasks.register("checkGeckoLib", CheckGeckoLib) {
	group = "verification"
	description = "Fails unless the resolved GeckoLib jar is the audited one."
	jars.from(configurations.runtimeClasspath)
	sha512 = project.geckolib_sha512
}
tasks.named("jar") { dependsOn checkGeckoLib }
tasks.named("check") { dependsOn checkGeckoLib }

apply from: "gradle/lang.gradle"
apply from: "gradle/literals.gradle"
apply from: "gradle/gametest.gradle"
apply from: "gradle/colour-gate.gradle"
apply from: "gradle/clientlock.gradle"

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

checkstyle {
	toolVersion = '14.3.0'
	configFile = file('config/checkstyle/checkstyle.xml')
	maxWarnings = 0
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
}

// Client GameTests, tools/record-evidence.sh and the play-test client (tools/play.sh) use the Vulkan
// backend on macOS: OpenGL hangs in SDL_GL_SwapWindow while the screen is locked (#251, #253). Set
// DEEPCHARTER_GL=1 to keep OpenGL, for example for Iris shader tryouts. Linux and CI are unchanged.
if (System.getProperty("os.name").toLowerCase().contains("mac") && System.getenv("DEEPCHARTER_GL") != "1") {
	loom.runs.matching { it.name in ["clientGameTest", "play"] }.configureEach {
		programArgs "--graphicsBackend", "vulkan"
	}
}
