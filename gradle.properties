# Loom: Minecraft's sources overran the 512 MiB default daemon heap (GC thrashing on check --rerun-tasks)
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# A Gradle deprecation fails the build, so an upgrade surfaces it while it is cheap.
org.gradle.warning.mode=fail

# Mod Properties
version=0.2.0
maven_group=io.github.pkeppeler.deepcharter
