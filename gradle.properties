# Error Prone (#632): these flags make javac run in the daemon; without them the plugin forks a javac worker per build directory, and the daemon keeps every one alive.
# Heap: Minecraft's sources overran the 512 MiB default daemon heap (GC thrashing on check --rerun-tasks).
org.gradle.jvmargs=-Xmx2G --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED --add-opens=jdk.compiler/com.sun.tools.javac.comp=ALL-UNNAMED
org.gradle.parallel=true
org.gradle.configuration-cache=true
# A Gradle deprecation fails the build, so an upgrade surfaces it while it is cheap.
org.gradle.warning.mode=fail

# Mod Properties
version=0.2.0
maven_group=io.github.pkeppeler.deepcharter
