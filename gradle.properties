# Daemon heap. The kind's baseline is 2 GiB (Minecraft's sources overran the 512 MiB default). Measured 2026-10-14 under
# `./gradlew build --rerun-tasks` (28 tasks, jstat -gc once a second on the daemon, 162 samples, 2m42s): peak used heap 690 MB of the
# 1024 MB cap, old generation peak 351 MB, 0 Full GCs, 6.6 s total GC time. 1 GiB holds with about 3x headroom for the live set,
# and a daemon that never grows past what it uses costs less RAM than a 2 GiB cap on a 16 GB Mac with several worktrees. Re-measure
# when Error Prone or NullAway (which run inside the daemon's javac) land, and raise to -Xmx2G if old-gen peaks above 600 MB.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=true
# A Gradle deprecation fails the build, so an upgrade surfaces it while it is cheap.
org.gradle.warning.mode=fail

# Mod Properties
version=0.2.0
maven_group=io.github.pkeppeler.deepcharter
